# goindex example configuration.
#
# Every value here can also be supplied via a GOINDEX_-prefixed environment
# variable (env vars take precedence over this file). Copy to config.yaml and
# edit, or configure entirely through the environment.

log_level: info

server:
  listen_addr: ":8080"
  # Externally reachable base URL, used to build absolute NZB links in
  # Newznab responses. Set this to how Sonarr/Radarr reach the indexer.
  base_url: "http://localhost:8080"
  read_timeout: 30s
  write_timeout: 60s

database:
  # Either set dsn directly, or the discrete fields below.
  # dsn: "postgres://goindex:secret@localhost:5432/goindex?sslmode=disable"
  host: localhost
  port: 5432
  user: goindex
  password: "changeme"
  name: goindex
  ssl_mode: disable
  max_conns: 10

nntp:
  host: news.example.com
  port: 563
  tls: true
  username: "your-usenet-username"
  password: "your-usenet-password"
  # Keep at or below your provider's connection limit.
  max_conns: 20
  connect_timeout: 30s

scan:
  groups:
    - alt.binaries.example
  # Articles per XOVER request.
  batch_size: 10000
  # How often forward scans run (env: GOINDEX_SCAN_INTERVAL).
  interval: 15m
  # How often the assemble loop runs (env: GOINDEX_SCAN_DOWNSTREAM_INTERVAL).
  downstream_interval: 5m
  # How often the release-build loop runs (env: GOINDEX_SCAN_BUILD_INTERVAL).
  build_interval: 2m
  # How often post-processing (PAR2 name/NFO recovery) runs
  # (env: GOINDEX_SCAN_POSTPROCESS_INTERVAL).
  postprocess_interval: 5m
  # Cap articles ingested per forward-scan pass per group so a firehose group
  # yields; the watermark resumes next pass. 0 = unlimited.
  # (env: GOINDEX_SCAN_FORWARD_MAX_ARTICLES).
  forward_max_articles: 1000000
  # Backfill depth. 0 disables date-based backfill.
  backfill_days: 0
  # Cap articles walked backwards per backfill pass. 0 = unlimited.
  backfill_max_articles: 0

auth:
  # Required in production; signs SPA session tokens.
  jwt_secret: "change-me-to-a-long-random-string"
  session_ttl: 24h
  default_rate_limit: 100
  rate_limit_window: 1h

metadata:
  # Optional release metadata enrichment (match TV shows for cover art and
  # details). Disabled by default (env: GOINDEX_METADATA_ENABLED).
  enabled: false
  # Provider: "tvmaze" (keyless, TV) is the default and only built-in provider.
  # (env: GOINDEX_METADATA_PROVIDER)
  provider: tvmaze
  # How often the enrichment loop runs (env: GOINDEX_METADATA_INTERVAL).
  interval: 30m
